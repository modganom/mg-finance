<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MG’s Finance">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>MG’s Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#F0F2F6; --line:#E4E8EE; --text:#101828; --mute:#667085;
  --accent:#4F46E5; --accentSoft:rgba(79,70,229,.10); --accentLine:rgba(79,70,229,.45); --pos:#12A150; --neg:#E5483A; --warn:#D98A00; --liquid:#1E88E5; --total:#C98A0E;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);
  --sans:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
  --display:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B0F14; --surface:#131A22; --surface2:#1A232D; --line:#232E3A; --text:#EEF2F6; --mute:#8B98A8;
  --accent:#8A90FF; --accentSoft:rgba(138,144,255,.16); --accentLine:rgba(138,144,255,.55); --pos:#3CCB7F; --neg:#FF6B5E; --warn:#F5B83D; --liquid:#5CB8FF; --total:#F2C25B;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column}
#scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#scroller>main{min-height:calc(100% + 1px)}
.remain{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 14px;border-radius:14px;font-weight:600;font-size:14px}
.remain .num{font-family:var(--display);font-weight:800;font-size:18px}
.remain.pos{background:rgba(60,203,127,.13);color:var(--pos)}
.remain.neg{background:rgba(255,107,94,.14);color:var(--neg)}
.alloc{margin-top:12px}
.saved{margin-top:8px;padding:10px 14px;border-radius:14px;background:var(--surface2);font-weight:600;font-size:14px}
.saved .num{font-family:var(--display);font-weight:800;font-size:18px;color:var(--liquid)}
.saved .num .small{font-family:var(--sans);font-weight:500;font-size:12.5px}
.serleg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.serleg>div{background:var(--surface2);border-radius:12px;padding:9px 12px}
.serleg .v{display:block;font-family:var(--display);font-weight:800;font-size:17px;margin:2px 0}
html{touch-action:manipulation}
html.standalone,html.standalone>body{height:var(--appH)}
html.standalone>body{height:calc(var(--appH) - env(safe-area-inset-top,0px))}
html.standalone .tabbar{position:relative;flex:none}
html.standalone main{padding-bottom:24px}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-60px);opacity:0;z-index:40;pointer-events:none;background:var(--surface);border:1px solid var(--line);color:var(--mute);box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .2s,opacity .2s}
#ptr svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ptr.ready{color:var(--accent)}
#ptr.error{color:var(--neg)}
#ptr.spin{color:var(--accent)}
#ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,.brand,.big,.huge,.num,.tile .v{font-family:var(--display)}

/* app bar and navigation */
.appbar{display:none;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.appbar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 16px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.03em;margin-right:auto}
.topnav{display:none;gap:4px}
.topnav button,.tabbar button{border:0;background:transparent;cursor:pointer;color:var(--mute);font-weight:600}
.topnav button{padding:8px 12px;border-radius:999px;font-size:14px}
.topnav button[aria-current="page"]{background:var(--surface2);color:var(--text)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.head .tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.themebtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--text)}
.themebtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;padding:4px 0}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
@media(min-width:900px){.appbar{display:block}.topnav{display:flex}.tabbar{display:none}}

/* layout */
main{max-width:1120px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){main{padding:24px 16px 64px}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0}
h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.q{color:var(--mute);font-size:13px;margin:2px 0 0}
.grid{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g57{grid-template-columns:5fr 7fr}.g75{grid-template-columns:7fr 5fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card.tap{cursor:pointer;text-align:left;width:100%;display:block}
.card.tap:hover{border-color:var(--accent)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:2px 0;white-space:nowrap}
.k{color:var(--mute);font-size:13px;font-weight:500;display:block}
.big{font-size:34px;font-weight:800;letter-spacing:-.035em;display:block;line-height:1.1;margin:4px 0}
.huge{font-size:56px;font-weight:800;letter-spacing:-.06em;line-height:.85}
.days{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.badge{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--mute)}
.badge.up{background:rgba(60,203,127,.15);color:var(--pos)}
.badge.down{background:rgba(255,107,94,.15);color:var(--neg)}
.badge.sm{font-size:11px;padding:2px 7px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mute{color:var(--mute)}
.small{font-size:12.5px}

/* chips and segmented controls */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accentSoft);color:var(--text);border-color:var(--accentLine)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.rangebar{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.rnav{display:flex;align-items:center;gap:8px}
.rnav .lbl{font-weight:700;font-size:14px;min-width:0;flex:1}
.rnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:17px;line-height:1}
.rnav button:disabled{opacity:.35;cursor:default}
.dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dates input{font:inherit;font-size:14px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 10px}

/* bars and lists */
.bar{position:relative;height:8px;background:var(--surface2);border-radius:999px;margin-top:7px;overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent);max-width:100%}
.bar>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.5;border-radius:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rowbtn{display:block;width:100%;border:0;background:none;text-align:left;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.rowbtn:last-child{border-bottom:0}
.rowbtn .n{font-weight:600;font-size:14px}
.rowbtn .v{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:0}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface2);margin:8px 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mute)}
.chartbox{position:relative;height:260px}
.chartbox.mid{height:220px}
.chartbox.sm{height:150px}
.donutwrap{position:relative;height:230px;max-width:260px;margin:0 auto 10px}
.donutc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface2);border-radius:14px;padding:12px 14px}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.03em;display:block}
.banner{background:rgba(255,107,94,.12);color:var(--neg);border-radius:14px;padding:11px 14px;margin-bottom:10px;font-weight:600;font-size:14px}
.banner.info{background:rgba(138,144,255,.13);color:var(--accent)}
.banner{display:flex;align-items:flex-start;gap:10px}
.banner>span{flex:1}
.banner .link{color:inherit;text-decoration:underline;padding:0;font-size:inherit}
.banner .x{border:0;background:none;color:inherit;cursor:pointer;font-size:20px;line-height:1;padding:0 2px;opacity:.75}
.grid.pair{grid-template-columns:1fr 1fr}
.card.tap.strip{display:grid;grid-template-columns:repeat(3,1fr);padding:0;margin-bottom:12px;overflow:hidden}
.strip .cell{padding:14px 16px;border-top:3px solid var(--c);min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:calc(63px + 1.1 * clamp(20px,6.4vw,34px))}
@media(max-width:520px){.strip .cell{padding:12px 12px;min-height:calc(55px + 1.1 * clamp(20px,6.4vw,34px))}}
.strip .cell+.cell{border-left:1px solid var(--line)}
.strip .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .sw{width:8px;height:8px;margin-right:6px}
.strip .v{font-family:var(--display);font-weight:800;font-size:clamp(18px,5.2vw,26px);display:block;margin-top:4px}
.pair .big{font-size:clamp(20px,6.4vw,34px)}
@media(max-width:520px){.pair .card{padding:14px}.brand{font-size:17px}}
.cal .mo{display:block;font-size:9px;font-weight:700;color:var(--mute);line-height:1;margin-bottom:1px}
.empty{color:var(--mute);padding:14px 0;font-size:14px}

/* records */
.rec{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.ricon{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#0B0F14}
.rmid{flex:1;min-width:0}
.rmid .t{font-weight:600;font-size:14.5px}
.rmid .s{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rright{text-align:right;flex:none}
.rright .a{font-weight:700;font-variant-numeric:tabular-nums}
.rright .tm{color:var(--mute);font-size:12px}
.dayhead{font-size:12.5px;font-weight:700;color:var(--mute);margin:14px 0 2px}
.search{width:100%;font:inherit;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:10px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;color:var(--mute);text-align:center}
.cal button{aspect-ratio:1;border:0;border-radius:9px;background:var(--surface2);font-size:11.5px;font-weight:600;cursor:pointer;color:var(--text);padding:0}
.cal button.off{visibility:hidden}
.cal button.fut{opacity:.35}

/* budgets */
.budrow{display:block;width:100%;border:0;background:none;text-align:left;cursor:pointer;padding:11px 0;border-bottom:1px solid var(--line)}
.budrow:last-child{border-bottom:0}
.edit input{width:110px;font:inherit;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:right}
.edit .row{padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text)}
.sample{font-size:12.5px;color:var(--mute);margin:0 0 12px}
.loading{padding:60px 0;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header class="appbar"><div class="in">
  <div class="brand">MG’s Finance</div>
  <nav class="topnav" id="topnav" aria-label="Pages"></nav>
</div></header>
<div id="ptr" aria-label="Refresh" role="status"></div><div id="scroller"><main id="view"><div class="loading">Loading your numbers...</div></main></div>
<nav class="tabbar" id="tabbar" aria-label="Pages"></nav>

<script>
(function(){
'use strict';
var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
var KEY = '';
var API = null;
(function(){
  if (IS_GAS) return;
  var o = {}; location.hash.replace(/^#/, '').split('&').forEach(function(p){ var i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); });
  var u = o.u, k = o.k;
  try { if (u && k){ localStorage.setItem('mgU', u); localStorage.setItem('mgK', k); } else { u = localStorage.getItem('mgU'); k = localStorage.getItem('mgK'); } } catch(e) {}
  if (u && k && /^https:\/\/script\.google\.com\//.test(u)) API = {u:u, k:k};
})();

    .then(function(d){ if (d && d.error) bad(new Error(d.error)); else ok(d); }).catch(bad);
}
function apiPost(body, ok, bad){
  body.k = API.k;
  fetch(API.u, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)}).then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.error) bad(new Error(d.error)); else ok(d); }).catch(bad);
}
function tellLauncher(t){ try { window.top.postMessage({mgTheme:t}, '*'); } catch(e) {} }
function tellHeight(){ try { if (window.top !== window) window.top.postMessage({mgH: window.innerHeight}, '*'); } catch(e) {} }
window.addEventListener('resize', tellHeight); setTimeout(tellHeight, 300); setTimeout(tellHeight, 1500);
var PAGES = [
  {id:'overview', name:'Overview', short:'Home', icon:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'},
  {id:'balance', name:'Balance', short:'Balance', icon:'<path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/>'},
  {id:'cashflow', name:'Cash flow', short:'Flow', icon:'<path d="M7 4v16M7 20l-3-3M7 20l3-3"/><path d="M17 20V4M17 4l-3 3M17 4l3 3"/>'},
  {id:'spending', name:'Spending', short:'Spending', icon:'<circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 5"/>'},
  {id:'budgets', name:'Budgets', short:'Budgets', icon:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>'},
  {id:'records', name:'Records', short:'Records', icon:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>'}
];
var CAT_COL = {'Groceries':'#F97066','Eating Out':'#FDB022','Bills & Utilities':'#2ED3B7','Home':'#A48AFB','Transport & Car':'#7CD4FD','Shopping':'#F670C7','Life & Fun':'#85E13A','Family & Giving':'#FD853A','Fees & Other':'#98A2B3','Health & Care':'#36BFFA','Debt':'#B7795D'};
var LAB_COL = {'Planned':'#85E13A','Impulse':'#FDB022','Leak':'#F97066','Social':'#7CD4FD','Work':'#A48AFB','To be paid back':'#2ED3B7'};
var MNW_COL = {'Must':'#F97066','Need':'#FDB022','Want':'#2ED3B7','Not tagged':'#667085'};
var ACC_COL = {'Bank':'#85E13A','Cash Daily':'#98A2B3','Savings':'#5CB8FF','Whish':'#F97066','Gold':'#F2C25B','Crypto':'#A48AFB'};
var EXTRA = ['#36BFFA','#EE46BC','#9E77ED','#32D583','#FEC84B','#F38744'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var S = {
  data:null, page:'overview', theme:'dark', charts:[], hist:null,
  hide:true, ov:{ser:'Liquid'}, loadedAt:0, busy:false,
  bal:{range:'30d', on:{'Liquid':true}},
  cf:{r:{type:'pp',off:0}, trend:'trend', cmp:'net'},
  sp:{r:{type:'pp',off:0}, view:'cat', nature:'All', accts:null},
  bu:{off:0, mode:'pct', edit:false, saving:false},
  rec:{q:'', type:'All', range:'30d', cat:null, label:null, mnw:null, day:null, start:null, end:null, limit:60, origin:null}
};

/* ---------- utils ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function D(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function K(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function add(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function diff(a, b){ return Math.round((a - b) / 864e5); }
function today(){ return D(S.data.today); }
function fd(d){ return MONTHS[d.getMonth()] + ' ' + d.getDate(); }
function fdy(d){ return fd(d) + ', ' + d.getFullYear(); }

}

  var d0 = dataStart(), t = today(), cur = {}, flows = {}, out = {};
  S.data.accounts.forEach(function(a){ if (!isInv(a.name)) cur[a.name] = a.balance; });
  S.data.tx.forEach(function(x){ if (x.d > t) return; var f = flowsOf(x); flows[x.date] = flows[x.date] || {}; for (var a in f) flows[x.date][a] = (flows[x.date][a] || 0) + f[a]; });
  for (var d = t; d >= d0; d = add(d, -1)){
    var k = K(d), snap = {}; for (var a in cur) snap[a] = cur[a]; out[k] = snap;

  var sn = S.data.snapshots.slice().sort(function(a, b){ return a.date < b.date ? -1 : 1; });

  var j = 0, g = sn.length ? sn[0].gold : gNow, c = sn.length ? sn[0].crypto : cNow;

    if (k === K(t)){ g = gNow; c = cNow; }
    out[k]['Gold'] = g; out[k]['Crypto'] = c;

})();
